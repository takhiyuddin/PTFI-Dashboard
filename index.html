      function sync(a, b) {
        const an = [...a.childNodes],
          bn = [...b.childNodes];
        bn.forEach((n, i) => {
          const o = an[i];
          if (!o) {
            a.appendChild(n.cloneNode(true));
            return;
          }
          if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) {
            a.replaceChild(n.cloneNode(true), o);
            return;
          }
          if (n.nodeType === 3) {
            if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue;
            return;
          }
          if (n.nodeType !== 1) return;
          for (const at of [...o.attributes])
            if (!n.hasAttribute(at.name)) o.removeAttribute(at.name);
          for (const at of n.attributes)
            if (o.getAttribute(at.name) !== at.value)
              o.setAttribute(at.name, at.value);
          sync(o, n);
        });
        while (a.childNodes.length > bn.length) a.removeChild(a.lastChild);
      }

      function cumulativeHourShare(t) {
        const a = A();
        const h = clamp(t - 6, 0, 12);
        const full = Math.floor(h);
        const frac = h - full;
        let sum = 0;
        for (let i = 0; i < full; i++) sum += a.hourlyShare[i];
        if (full < 12) sum += a.hourlyShare[full] * frac;
        return sum;
      }

      function lvl(i) {

          plan = (a.np / 2) * (i === 3 ? 0.03 : 1),
          pace = a.levelEfficiency[i] * LVL_PACE[i],
          cumShare = cumulativeHourShare(S.t),
          val = plan * clamp(cumShare * pace * dayK(), 0, 1.15);
        return {
          plan,
          val,
          name: LVL_NAME[i],
          unit: LVL_UNIT[i],
          pace,
          pct: (val / plan) * 100,
        };

        const fl = flagsOf(),

          sw = activeDefs.reduce((s, b) => s + b.w, 0);
        return a.blocks.map((b) => {
          if (!b.act) return { ...b, flag: null };
          const f = fl[b.id] || null,
            share = b.w / sw,
            minedBlk = lvl(0).val * share;

            ...b,
            flag: f,

            u: f === "restr" ? Math.min(3, b.u) : b.u,
            w: f === "restr" ? 0 : b.wkr,
            ton: Math.max(0, b.ton - minedBlk),
            eff: f === "restr" ? Math.min(0.78, b.eff) : b.eff,

              "—",
              x.st === "maint" ? "warn" : "crit",
              `<b>${x.id}</b> (${x.n}) — ${x.st === "maint" ? "maintenance" : "breakdown"} · ${x.op}`,
            ]),
          );
        if (S.day === TODAY)
          S.notes
            .slice(0, 6)
            .forEach((n) =>
              ev.push([n.t + " WIB", n.sev, `Log notifikasi: ${n.txt}`]),
            );
        return ev.length
          ? ev
              .map(
                (e) =>
                  `<div class="inc"><time>${e[0]}</time><span class="sev" style="background:${SEVC[e[1]] || SEVC.ok}"></span><span>${e[2]}</span></div>`,
              )
              .join("")
          : `<p>Tidak ada insiden tercatat pada shift ini.</p>`;
      }

      function qfData() {
        const a = A(),
          pg = S.page,
          li = S.rlvl || 0,
          g = S.rgran || 2;
        if (pg === "production") {
          const L = lvl(li),
            k = L.pace * dayK(),
            G = [],
            p2 = (n) => String(n).padStart(2, "0"),
            bk = S.rblk || "all",
            bb = blocks().find((b) => b.id === bk),
            bs0 = bb && bb.act ? bb.share : 1;
          for (let s = 0; s < 12; s += g) {
            let tg = 0,
              ac = 0,
              el = 0;
            for (let h = s; h < s + g; h++) {
              const sh = a.hourlyShare[h],
                ef = clamp(S.t - (6 + h), 0, 1);
              tg += L.plan * sh * bs0;
              ac += L.plan * sh * k * ef * bs0;
              el += ef;
            }
            G.push({
              l: g === 1 ? `${p2(6 + s)}:00` : `${p2(6 + s)}–${p2(6 + s + g)}`,
              a: ac,
              b: tg,
              n: el > 0 ? ac - tg : null,
            });
          }
          return {
            G,
            nm: ["Aktual", "Target", "Selisih"],
            un: L.unit,
            ttl: `Total ${MET[li]}${bb && bb.act ? " · Blok " + bk : ""}`,
            total: `${fmt(L.val * bs0)}<span>${L.unit}</span>`,
          };
        }
        const cs = cards(),
          c0 = cs[0],
          sh =
            pg === "ecology"
              ? ["Tailings", "ARD", "Highland", "Lowland"]
              : ["Extraction", "Haulage", "Mill", "Portsite"];
        return {
          G: cs.map((c) => ({
            l: sh[c.i],
            a: c.A[1],
            b: c.B[1],
            n: c.A[1] - c.B[1],
          })),
          nm: [c0.A[0], c0.B[0], "Selisih"],
          un: "",
          ttl: `Total ${c0.A[0]}`,
          total: fmt(cs.reduce((s, c) => s + c.A[1], 0)),
        };
      }

      function qfChart(G, nm, un) {
        const mob = matchMedia("(max-width:640px)").matches,
          W = mob ? 520 : 1000,
          H = 400,
          L = mob ? 56 : 84,
          R = 20,
          T = 28,
          B = 52,
          pw = W - L - R,
          ph = H - T - B;
        const mx0 = Math.max(1, ...G.map((x) => Math.max(x.a, x.b))),
          mn0 =
            Math.min(0, ...G.filter((x) => x.n != null).map((x) => x.n)) * 1.15;
        const st = niceStep(mx0 - mn0),
          yMax = Math.ceil(mx0 / st) * st,
          yMin = Math.floor(mn0 / st) * st;
        const y = (v) => T + ((yMax - v) / (yMax - yMin)) * ph,
          cw = pw / G.length,
          bw = Math.min(34, cw * 0.22),
          gap = 3,
          cx = (i) => L + cw * (i + 0.5);
        let s = `<svg viewBox="0 0 ${W} ${H}" class="qf-svg" role="img" aria-label="Grafik">`,
          hits = "";
        for (let v = yMin; v <= yMax + st / 1000; v += st)
          s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e9ebef"/><text x="${L - 12}" y="${y(v) + 5}" text-anchor="end" class="qf-ax">${v < 0 ? "-" : ""}${K(Math.abs(v))}</text>`;
        const bar = (v, x, c, i) =>
          v > 0
            ? `<rect class="qf-bar" style="--i:${i}" x="${x}" y="${y(v)}" width="${bw}" height="${y(0) - y(v)}" rx="8" fill="${c}"/>`
            : "";
        const pts = [];
        G.forEach((x, i) => {
          s +=
            bar(x.b, cx(i) - bw - gap / 2, QF_C.b, i) +
            bar(x.a, cx(i) + gap / 2, QF_C.a, i) +
            `<text x="${cx(i)}" y="${H - 16}" text-anchor="middle" class="qf-ax">${x.l}</text>`;
          hits += `<rect class="qf-hit" data-i="${i}" x="${cx(i) - cw / 2}" y="${T}" width="${cw}" height="${ph}" fill="transparent"/>`;
          if (x.n != null) pts.push([cx(i), y(x.n)]);
        });
        if (pts.length > 1) {
          let d = `M${pts[0][0]},${pts[0][1]}`;
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i],
              p1 = pts[i],
              p2 = pts[i + 1],
              p3 = pts[i + 2] || p2;
            d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
          }
          s += `<path d="${d}" fill="none" stroke="${QF_C.n}" stroke-width="1.4" stroke-dasharray="3 3"/>`;
        }
        s +=
          pts
            .map(
              (p) =>
                `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${QF_C.n}"/>`,
            )
            .join("") +
          hits +
          "</svg>";
        const f = (v) => (v == null ? "—" : dec(v) + (un ? " " + un : "")),
          on = Math.max(0, G.map((x) => x.n != null).lastIndexOf(true));
        const tips = G.map(
          (x, i) =>
            `<div class="qf-tip ${i === on ? "on" : ""}" data-i="${i}" style="left:clamp(15%,${(cx(i) / W) * 100}%,85%)"><div><i style="background:${QF_C.a}"></i>${nm[0]}<b>${f(x.a)}</b></div><div><i style="background:${QF_C.b}"></i>${nm[1]}<b>${f(x.b)}</b></div><hr><div><i style="background:${QF_C.n}"></i>${nm[2]}<b>${f(x.n)}</b></div></div>`,
        ).join("");
        return s + tips;
      }

      const qfSmooth = (pts) => {
        let d = `M${pts[0][0]},${pts[0][1]}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i],
            p1 = pts[i],
            p2 = pts[i + 1],
            p3 = pts[i + 2] || p2;
          d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
        }
        return d;
      };

      function qfLine() {
        const a = A(),
          pl = a.np / 2,
          pace = a.levelEfficiency[0],
          idx = clamp(TODAY - S.day, 0, 6),
          f0 = dayK(),
          yd = SHIFT_HISTORY[idx + 1],
          avg7 =
            SHIFT_HISTORY.reduce((s, h) => s + h.factor, 0) /
            SHIFT_HISTORY.length,
          cum = (t, f) =>
            pl * clamp(cumulativeHourShare(t) * pace * f, 0, 1.15);
        const ser = [
          { n: "Hari ini", c: QF_C.a, f: f0, upto: S.t, main: 1 },
          { n: "Kemarin", c: QF_C.b, f: yd && yd.factor, upto: 18 },
          { n: "Rata-rata 7 hari", c: QF_C.n, f: avg7, upto: 18 },
          { n: "Target", c: "#9aa09c", f: 1 / pace, upto: 18, dash: 1 },
        ].filter((s) => s.f != null);

        const mob = matchMedia("(max-width:640px)").matches,
          W = mob ? 520 : 1000,
          H = 400,
          Lm = mob ? 56 : 84,
          R = 24,
          T = 28,
          B = 52,
          pw = W - Lm - R,
          ph = H - T - B;
        const peak = Math.max(1, ...ser.map((s) => cum(18, s.f))),
          st = niceStep(peak),
          yMax = Math.ceil(peak / st) * st;
        const x = (h) => Lm + ((h - 6) / 12) * pw,
          y = (v) => T + (1 - v / yMax) * ph,
          hs = Array.from({ length: 13 }, (_, i) => 6 + i);
        const pts = (s) => {
          const ts = hs.filter((h) => h < s.upto);
          ts.push(s.upto);
          return ts.map((t) => [x(t), y(cum(t, s.f))]);
        };

        let svg = `<svg viewBox="0 0 ${W} ${H}" class="qf-svg" role="img" aria-label="Perbandingan produksi kumulatif">
      <defs><linearGradient id="qfg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${QF_C.a}" stop-opacity=".28"/><stop offset="1" stop-color="${QF_C.a}" stop-opacity="0"/></linearGradient></defs>`;
        for (let v = 0; v <= yMax + st / 1000; v += st)
          svg += `<line x1="${Lm}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e9ebef"/><text x="${Lm - 12}" y="${y(v) + 5}" text-anchor="end" class="qf-ax">${K(v)}</text>`;
        for (let h = 6; h <= 18; h += mob ? 3 : 2)
          svg += `<text x="${x(h)}" y="${H - 16}" text-anchor="middle" class="qf-ax">${hh(h)}</text>`;
        svg += `<line x1="${x(S.t)}" x2="${x(S.t)}" y1="${T}" y2="${y(0)}" stroke="#c9cdc9" stroke-dasharray="4 4"/>`;

        ser
          .slice()
          .reverse()
          .forEach((s) => {
            const p = pts(s),
              i = ser.indexOf(s);
            if (p.length < 2) return;
            if (s.main)
              svg += `<path class="qf-area" d="${qfSmooth(p)} L${p[p.length - 1][0]},${y(0)} L${p[0][0]},${y(0)}Z" fill="url(#qfg)"/>`;
            svg += s.dash
              ? `<path class="qf-fade" d="${qfSmooth(p)}" fill="none" stroke="${s.c}" stroke-width="2" stroke-dasharray="6 6"/>`
              : `<path class="qf-line" style="--i:${ser.length - 1 - i}" pathLength="1" d="${qfSmooth(p)}" fill="none" stroke="${s.c}" stroke-width="${s.main ? 3.5 : 2.5}" stroke-linecap="round" stroke-linejoin="round"/>`;
          });

        const m = ser.find((s) => s.main),
          mp = pts(m).pop();
        svg += `<circle class="qf-pulse" cx="${mp[0]}" cy="${mp[1]}" r="7" fill="${m.c}"/><circle class="qf-dot" cx="${mp[0]}" cy="${mp[1]}" r="6.5" fill="${m.c}" stroke="#fff" stroke-width="3"/>`;
        svg +=
          hs
            .map(
              (h, i) =>
                `<rect class="qf-hit" data-i="${i}" x="${x(h) - pw / 24}" y="${T}" width="${pw / 12}" height="${ph}" fill="transparent"/>`,
            )
            .join("") + "</svg>";

        const f = (v) => fmtB(v) + " mt",
          on = clamp(Math.floor(S.t) - 6, 0, 12);
        const tips = hs
          .map(
            (h, i) =>
              `<div class="qf-tip ${i === on ? "on" : ""}" data-i="${i}" style="left:clamp(15%,${(x(h) / W) * 100}%,85%)"><div style="color:var(--mut);font-size:13px">${hh(h)} WIB</div>${ser.map((s) => `<div><i style="background:${s.c}"></i>${s.n}<b>${h <= s.upto + 1e-9 ? f(cum(h, s.f)) : "—"}</b></div>`).join("")}</div>`,
          )
          .join("");
        return { html: svg + tips, ser };
      }
      function reportHTML(mode = "") {

        const days = Array.from({ length: 7 }, (_, i) => TODAY - i);

      function printReport() {

        p.innerHTML = printHTML();

      /* Dipanggil di baris pertama act(): jika true, aksi sudah ditangani */
      function qfAct(a, d) {
        switch (a) {
          case "report":
            S.menu = null;
            S.rtab = "sum"; // halaman pertama = Ringkasan
            S.rpop = null;
            openModal("report", reportTitle(), reportHTML("in"));
            renderAll();
            return true;
          case "rtab":
            S.rtab = d.v;
            S.rpop = null;
            refreshReport("sw");
            return true;
          case "rgran":
            S.rgran = (S.rgran || 2) === 2 ? 1 : 2;
            refreshReport("sw");
            return true;
          case "rlvl":
            S.rlvl = +d.v;
            refreshReport();
            return true;
          case "rblk":
            S.rblk = d.v;
            refreshReport();
            return true;
          case "rstat":
            S.rstat = d.v;
            refreshReport();
            return true;
          case "rreset":
            S.rlvl = 0;
            S.rblk = "all";
            S.rstat = "all";
            refreshReport();
            return true;
          case "rfil":
            S.rfil = d.v;
            S.rpop = null;
            refreshReport();
            return true;
          case "rpop":
            S.rpop = S.rpop === d.v ? null : d.v;
            refreshReport();
            return true;
          case "rnoteadd":
            S.rtab = "hnd";
            S.rpop = null;
            refreshReport();
            setTimeout(() => $("rnote") && $("rnote").focus(), 30);
            return true;
          case "copyrpt": {
            const txt = rptText();
            const ok = () => toast("Ringkasan disalin"),
              fb = () => {
                const t = document.createElement("textarea");
                t.value = txt;
                t.style.cssText = "position:fixed;opacity:0";
                document.body.appendChild(t);
                t.select();
                let r = false;
                try {
                  r = document.execCommand("copy");
                } catch (x) {}
                t.remove();
                toast(r ? "Ringkasan disalin" : "Gagal menyalin");
              };
            try {
              navigator.clipboard.writeText(txt).then(ok, fb);
            } catch (x) {
              fb();
            }
            return true;
          }
          case "mailrpt":
            location.href =
              "mailto:?subject=" +
              encodeURIComponent(
                `${reportTitle()} ${A().short} ${dLbl(S.day)}`,
              ) +
              "&body=" +
              encodeURIComponent(rptText());
            return true;
          case "csv": {
            const sc = d.v || "area",
              ks = sc === "all" ? allowedAreas() : [S.area],
              ds =
                sc === "week"
                  ? SHIFT_HISTORY.map((_, i) => TODAY - i)
                  : [S.day],
              rows = ["Seksi,Area,Tanggal,Item,Metrik,Nilai,Satuan"];
            ks.forEach((k) => ds.forEach((dd) => rows.push(...csvFor(k, dd))));
            const l = document.createElement("a");
            l.href = URL.createObjectURL(
              new Blob(["\ufeff" + rows.join("\n")], { type: "text/csv" }),
            );
            l.download = `ptfi-${sc === "all" ? "semua-area" : A().short}-${sc === "week" ? "7hari" : dLbl(S.day).replace(" ", "-")}.csv`;
            document.body.appendChild(l);
            l.click();
            l.remove();
            S.rpop = null;
            refreshReport();
            toast("CSV diunduh");
            return true;
          }
          case "print":
            if (d.v !== "rpt") return false;
            printReport();
            return true;
        }
        return false;
      }

      function act(a, d, e) {
        switch (a) {

              return;
            }
            S.page = d.v;
            S.lens = PAGE_LENS[d.v];
            S.level = 0;
            S.menu = null;
            reset("left", "rp");
            break;
          case "mob-lenses":
            openModal(
              "lenses",
              "Pilih Lensa Peta",
              `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px">${LENSES.map((l) => `<button class="btn ${S.lens === l[0] ? "" : "l"}" data-a="lens" data-v="${l[0]}" style="display:flex;align-items:center;gap:8px;text-align:left;padding:12px">${I(l[1])}<span>${l[2]}</span></button>`).join("")}</div>`,
            );
            return;
          case "lens":
            S.modal = null;
            if (d.v === "cctv") {
              openModal("cctv", "Remote Operations & CCTV", camHTML());
              break;
            }
            S.lens = d.v;
            S.menu = null;
            reset("frame");
            break;
          case "menu":
            S.menu = S.menu === d.v ? null : d.v;
            break;
          case "area":
            if (!canArea(d.v)) {
              toast("Akses area ini tidak tersedia untuk akun Anda");
              return;
            }
            S.area = d.v;
            S.sel.clear();
            S.menu = null;
            S.modal = null;
            reset("left", "frame", "rp");
            break;
          case "level":
            S.level = +d.v;
            S.menu = null;
            break;
          case "day":
            S.day = +d.v;
            S.live = S.day === TODAY;
            if (S.live) S.t = NOWH;
            S.menu = null;
            break;
          case "today":
            S.day = TODAY;
            S.live = true;
            S.t = NOWH;
            break;
          case "tab":
            S.tab = d.v;
            break;
          case "mode":
            S.mode = d.v;
            break;
          case "overlay":
            S.overlay = !S.overlay;
            break;
          case "blk":
            if (S.pd) return;
            S.menu = null;
            if (S.mode === "multi" || e.shiftKey)
              S.sel.has(d.id) ? S.sel.delete(d.id) : S.sel.add(d.id);
            else if (S.sel.size === 1 && S.sel.has(d.id)) S.sel.clear();
            else {
              S.sel.clear();
              S.sel.add(d.id);
            }
            break;
          case "focus":
            S.sel.clear();
            S.sel.add(d.id);
            S.menu = null;
            S.modal = null;
            break;
          case "clear":
            S.sel.clear();
            break;
          case "fsel":
            S.sel.clear();
            if (d.v !== "all")
              blocks()
                .filter(
                  (b) => b.act && (d.v === "ok" ? !b.flag : b.flag === d.v),
                )
                .forEach((b) => S.sel.add(b.id));
            S.menu = null;
            break;
          case "setflag":
            setFlag(d.id, d.v);
            S.menu = null;
            break;
          case "acc":
            S.acc[d.v] = !S.acc[d.v];
            break;
          case "ftype":
            S.ftype = d.v;
            break;
          case "unitst":
            S.unitSt[d.id] = d.v;
            S.notes.unshift({
              t: hh(S.t),
              sev: d.v === "ok" ? "ok" : "warn",
              txt: `${d.id} → status diperbarui menjadi ${d.v === "ok" ? "operasional" : d.v === "down" ? "breakdown" : "maintenance"}`,
              read: false,
            });
            saveOpsState();
            S.menu = null;
            break;
          case "uact": {
            const u = fleet().find((x) => x.id === d.id);
            if (!u) break;
            if (d.v === "flag") {
              S.unitSt[d.id] = "down";
              saveOpsState();
              toast(d.id + " ditandai kendala (breakdown)");
            } else if (d.v === "loc") {
              S.modal = null;
              S.sel.clear();
              S.sel.add(u.blk);
              toast(d.id + " berada di blok " + u.blk);
            } else if (d.v === "route") {
              toast(
                "Perintah penyesuaian rute " +
                  d.id +
                  " tercatat di MineStar Dispatch",
              );
            } else if (d.v === "assign") {
              const ids = blocks()
                  .filter((b) => b.act)
                  .map((b) => b.id),
                n = ids[(ids.indexOf(u.blk) + 1) % ids.length];
              S.assign[d.id] = n;
              saveOpsState();
              toast(`${d.id} dialihkan ke blok ${n}`);
            } else if (d.v === "sync") {
              toast("Sinkronisasi telemetri " + d.id + " selesai (0 ms drift)");
            } else if (d.v === "lock") {
              S.locked[d.id] = !S.locked[d.id];
              saveOpsState();
              toast(S.locked[d.id] ? "Target dikunci" : "Target dilepas");
            } else if (d.v === "reset") {
              delete S.unitSt[d.id];
              saveOpsState();
              toast("Status " + d.id + " dikembalikan ke baseline");
            }
            break;
          }
          case "mute": {
            const k = S.area + d.v;
            S.mute[k] = !S.mute[k];
            toast(S.mute[k] ? "Alarm area dibisukan" : "Alarm area aktif");
            break;
          }
          case "log": {
            const i = +d.v,
              sr = shiftRec();
            openModal(
              "log",
              "Log aktivitas — " + (S.page === "ecology" ? ECO[i] : LEVELS[i]),
              `<ul>${[
                `${hh(S.t)} WIB · Sinkronisasi telemetri SCADA & MineStar (${A().levelCodes[i]})`,
                `${hh(Math.max(6, S.t - 0.5))} WIB · Verifikasi tekanan ventilasi & sensor gas CO/O₂ selesai`,
                `${hh(Math.max(6, S.t - 1.2))} WIB · Inspeksi geoteknik drawpoint oleh tim Underground Geotechnical`,
                `06:00 WIB · Serah terima shift pagi diterima oleh ${sr.supervisor}`,
              ]
                .map((x) => `<li>${x}</li>`)
                .join("")}</ul>`,
            );
            break;
          }
          case "refresh":
            S.t0 = Date.now();
            RAWH = jakartaHour();
            NOWH = Math.min(18, Math.max(6, RAWH));
            if (S.live && S.day === TODAY) S.t = NOWH;
            toast("Data operasional disegarkan (" + hh(S.t) + " WIB)");
            break;
          case "share":
            try {
              navigator.clipboard.writeText(location.href);
            } catch (x) {}
            toast("Tautan disalin");
            break;
          case "report":
            openModal("report", "Laporan Shift Operasional", reportHTML());
            break;
          case "csv": {
            const l = document.createElement("a");
            l.href = URL.createObjectURL(
              new Blob([csv()], { type: "text/csv" }),
            );
            l.download = `ptfi-${A().short}-${dLbl(S.day).replace(" ", "-")}.csv`;
            l.click();
            break;
          }
          case "print":
            window.print();
            break;
          case "search":
            openModal(
              "search",
              "Search / ⌘ + K",
              `<input class="sinput" id="sq" placeholder="Cari area, blok (mis. BB), unit (mis. LHD-GBC-03), atau operator…" autocomplete="off"><div id="sres">${searchRes("")}</div>`,
            );
            setTimeout(() => $("sq")?.focus(), 60);
            break;
          case "sys":
            S.menu = null;
            openModal("sys", "Profil Akses & Status Sistem", sysHTML());
            break;
          case "resetdb":
            localStorage.removeItem(window.PTFI_API_CONFIG.storageKey);
            S.assign = {};
            S.unitSt = {};
            S.locked = {};
            Object.keys(AREAS).forEach((k) => {
              S.flags[k] = {};
              AREAS[k].blocks.forEach((b) => {
                if (b.act && b.flag) S.flags[k][b.id] = b.flag;
              });
            });
            S.modal = null;
            toast("Status operasional dikembalikan ke data awal");
            break;
          case "logout":
            logoutDashboard();
            return;
          case "alertwin": {
            const al = shiftRec().alert;
            if (!al) break;
            openModal(
              "al",
              al.title,
              `<p>${al.desc}</p><br><button class="btn" data-a="focus" data-id="${al.block}">Fokuskan blok ${al.block}</button>`,
            );
            break;
          }
          case "readall":
            S.notes.forEach((n) => (n.read = true));
            saveOpsState();
            break;
          case "zoom":
            zoomBy(d.v > 0 ? 1.2 : 1 / 1.2);
            return;
          case "full":
            toggleFull();
            return;
          case "mclose":
            S.modal = null;
            break;
        }
        renderAll();
      }

      document.addEventListener("click", (e) => {
        if (!CURRENT_USER) return;
        const el = e.target.closest("[data-a]");
        if (
          el &&
          el.dataset.a === "mclose" &&
          el.classList.contains("mbg") &&
          e.target !== el
        )
          return;
        if (
          S.menu &&
          !e.target.closest(".pop") &&
          !(el && el.dataset.a === "menu")
        ) {
          S.menu = null;
          if (!el) {
            renderAll();
            return;
          }
        }
        if (el) act(el.dataset.a, el.dataset, e);
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "sq" && $("sres"))
          $("sres").innerHTML = searchRes(e.target.value);
      });
      document.addEventListener("keydown", (e) => {
        if (!CURRENT_USER) return;
        if (e.key === "Escape") {
          if (S.modal || S.menu) {
            S.modal = null;
            S.menu = null;
            renderAll();
          } else if ($("map").classList.contains("full")) toggleFull();
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          act("search", {}, e);
        }
      });

      /* ===== TIMELINE & RANGE DRAG ===== */
      (function () {
        const tr = $("track");
        let dn = false;
        const set = (e) => {
          const r = tr.getBoundingClientRect();
          S.t = 6 + clamp((e.clientX - r.left) / r.width, 0, 1) * 12;
          S.live = false;
          if (S.day === TODAY && Math.abs(S.t - NOWH) < 0.08) {
            S.t = NOWH;
            S.live = true;
          }
          renderAll();
        };
        tr.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".alwin")) return;
          dn = true;
          S.pd = true;
          document.body.classList.add("dragging");
          tr.setPointerCapture(e.pointerId);
          set(e);
        });
        tr.addEventListener("pointermove", (e) => {
          if (dn) set(e);
        });
        const end = () => {
          dn = false;
          S.pd = false;
          document.body.classList.remove("dragging");
        };
        tr.addEventListener("pointerup", end);
        tr.addEventListener("pointercancel", end);
      })();
      document.addEventListener("pointerdown", (e) => {
        const th = e.target.closest(".th");
        if (!th) return;
        const idx = +th.dataset.th,
          box = $("rng").getBoundingClientRect();
        S.pd = true;
        document.body.classList.add("dragging");
        const mv = (ev) => {
          const x = clamp((ev.clientX - box.left) / box.width, 0, 1),
            r = S.range.slice();
          r[idx] =
            idx === 0 ? Math.min(x, r[1] - 0.08) : Math.max(x, r[0] + 0.08);
          S.range = r;
          renderRight();
        };
        const up = () => {
          S.pd = false;
          document.body.classList.remove("dragging");
          removeEventListener("pointermove", mv);
          removeEventListener("pointerup", up);
          removeEventListener("pointercancel", up);
        };
        addEventListener("pointermove", mv);
        addEventListener("pointerup", up);
        addEventListener("pointercancel", up);
        e.preventDefault();
      });

      /* ===== MAP PAN / ZOOM / FULLSCREEN ===== */
      const NW = 812,
        NH = 642;
      const applyView = () =>
        ($("world").style.transform =
          `translate(${S.view.x}px,${S.view.y}px) scale(${S.view.k})`);
      function applyV(v) {
        Object.assign(S.view, v);
        const w = $("world");
        w.style.width = v.W + "px";
        w.style.height = v.H + "px";
        applyView();
      }
      function viewFor(mw, mh, full) {
        if (!full) {
          const top = wide() ? 64 : 54,
            bottom = wide() ? 44 : 12,
            availH = mh - top - bottom;
          const k = Math.max(0.28, Math.min(1.3, (mw - 16) / NW, availH / NH));
          return {
            k,
            W: NW,
            H: NH,
            x: (mw - NW * k) / 2,
            y: top + Math.max(0, (availH - NH * k) / 2),
          };
        }
        const aw = mw - 32,
          ah = mh - 76 - 32,
          k = Math.max(0.28, Math.min(2, aw / NW, ah / NH));
        return { k, W: aw / k, H: ah / k, x: 16, y: 76 };
      }
      function fit() {
        const m = $("map"),
          w = $("world");
        if (!m.clientWidth || S.anim) return;
        const v = viewFor(
          m.clientWidth,
          m.clientHeight,
          m.classList.contains("full"),
        );
        if (!window.__fitted) {
          w.style.transition = "none";
          applyV(v);
          void w.offsetWidth;
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              w.style.transition = "";
              window.__fitted = 1;
            }),
          );
        } else applyV(v);
      }
      function toggleFull() {
        const m = $("map"),
          w = $("world");
        if (S.anim) return;
        const opening = !m.classList.contains("full");
        const vw = document.documentElement.clientWidth,
          vh = document.documentElement.clientHeight;
        const v0 = { ...S.view };
        let b0, b1, v1, ph;
        if (opening) {
          const r = m.getBoundingClientRect();
          ph = document.createElement("div");
          ph.id = "mapph";
          if (!wide()) ph.style.cssText = `height:${r.height}px;flex:none`;
          m.before(ph);
          b0 = { x: r.left, y: r.top, w: r.width, h: r.height, r: 24 };
          b1 = { x: 0, y: 0, w: vw, h: vh, r: 0 };
          v1 = viewFor(vw, vh, true);
        } else {
          ph = $("mapph");
          const r = ph.getBoundingClientRect();
          b0 = { x: 0, y: 0, w: vw, h: vh, r: 0 };
          b1 = { x: r.left, y: r.top, w: r.width, h: r.height, r: 24 };
          v1 = viewFor(r.width, r.height, false);
        }
        const setBox = (b) => {
          m.style.left = b.x + "px";
          m.style.top = b.y + "px";
          m.style.width = b.w + "px";
          m.style.height = b.h + "px";
          m.style.borderRadius = b.r + "px";
        };
        S.anim = true;
        m.classList.add("fsing");
        m.classList.remove("full");
        setBox(b0);
        w.style.transition = "none";
        const D = 650,
          t0 = performance.now(),
          L = (a, b, t) => a + (b - a) * t,
          ease = (t) =>
            t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const step = (now) => {
          const p = Math.min(1, Math.max(0, (now - t0) / D)),
            e = ease(p);
          setBox({
            x: L(b0.x, b1.x, e),
            y: L(b0.y, b1.y, e),
            w: L(b0.w, b1.w, e),
            h: L(b0.h, b1.h, e),
            r: L(b0.r, b1.r, e),
          });
          applyV({
            k: L(v0.k, v1.k, e),
            x: L(v0.x, v1.x, e),
            y: L(v0.y, v1.y, e),
            W: L(v0.W, v1.W, e),
            H: L(v0.H, v1.H, e),
          });
          if (p < 1) requestAnimationFrame(step);
          else {
            if (opening) m.classList.add("full");
            m.classList.remove("fsing");
            ["left", "top", "width", "height", "borderRadius"].forEach(
              (k) => (m.style[k] = ""),
            );
            if (!opening) ph.remove();
            S.anim = false;
            w.style.transition = "";
            fit();
          }
        };
        requestAnimationFrame(step);
      }
      function zoomBy(f, cx, cy) {
        const r = $("map").getBoundingClientRect();
        cx = cx ?? r.width / 2;
        cy = cy ?? r.height / 2;
        const nk = clamp(S.view.k * f, 0.25, 2.6),
          rf = nk / S.view.k;
        S.view.x = cx - (cx - S.view.x) * rf;
        S.view.y = cy - (cy - S.view.y) * rf;
        S.view.k = nk;
        applyView();
      }
      (function () {
        const m = $("map"),
          w = $("world");
        let st = null;
        m.addEventListener(
          "wheel",
          (e) => {
            if (!wide() && !e.ctrlKey && !m.classList.contains("full")) return;
            e.preventDefault();
            const r = m.getBoundingClientRect();
            w.style.transition = "none";
            zoomBy(
              e.deltaY < 0 ? 1.1 : 1 / 1.1,
              e.clientX - r.left,
              e.clientY - r.top,
            );
            requestAnimationFrame(() => (w.style.transition = ""));
          },
          { passive: false },
        );
        m.addEventListener("pointerdown", (e) => {
          if (!e.target.closest("button,.pop,.tools,.zm"))
            st = {
              x: e.clientX,
              y: e.clientY,
              vx: S.view.x,
              vy: S.view.y,
              mv: false,
            };
        });
        addEventListener("pointermove", (e) => {
          if (!st) return;
          const dx = e.clientX - st.x,
            dy = e.clientY - st.y;
          if (!st.mv && Math.hypot(dx, dy) > 5) {
            st.mv = true;
            S.pd = true;
            m.classList.add("grab");
            w.style.transition = "none";
          }
          if (st.mv) {
            S.view.x = st.vx + dx;
            S.view.y = st.vy + dy;
            applyView();
          }
        });
        const end = () => {
          if (st && st.mv) setTimeout(() => (S.pd = false), 60);
          m.classList.remove("grab");
          w.style.transition = "";
          st = null;
        };
        addEventListener("pointerup", end);
        addEventListener("pointercancel", end);
      })();
      new ResizeObserver(() => fit()).observe($("map"));

      /* ===== INTRO & REAL-TIME SHIFT CLOCK SYNC ===== */
      const INTRO = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      function endIntro() {
        if (!S.intro) return;
        S.intro = false;
        document.body.classList.remove("intro");
        RAWH = jakartaHour();
        NOWH = Math.min(18, Math.max(6, RAWH));
        if (S.live && S.day === TODAY) S.t = NOWH;
        renderAll();
      }
      function playIntro() {
        if (!S.intro) return;
        const t0 = performance.now(),
          D = 1800;
        const step = (now) => {
          if (!S.intro) return;
          RAWH = jakartaHour();
          NOWH = Math.min(18, Math.max(6, RAWH));
          const p = Math.min(1, Math.max(0, (now - t0) / D));
          S.t = 6 + (NOWH - 6) * (1 - Math.pow(1 - p, 3));
          renderTL();
          renderLeft();
          renderMap();
          renderRight();
          if (p < 1) requestAnimationFrame(step);
          else endIntro();
        };
        requestAnimationFrame(step);
      }
      document.addEventListener(
        "pointerdown",
        () => {
          if (S.intro) endIntro();
        },
        true,
      );

      /* Sinkronisasi waktu shift aktual (Asia/Jakarta) tanpa mutasi angka acak */
      setInterval(() => {
        if (!CURRENT_USER || S.pd || document.hidden || S.intro) return;
        RAWH = jakartaHour();
        NOWH = Math.min(18, Math.max(6, RAWH));
        const nd = jakartaDayNum();
        if (nd !== TODAY) {
          if (S.day === TODAY) S.day = nd;
          TODAY = nd;
        }
        if (S.day === TODAY && S.live) S.t = NOWH;
        renderTop();
        dayPill();
        renderTL();
        renderLeft();
        renderMap();
        renderRight();
      }, 5000);

      setInterval(() => {
        if (!CURRENT_USER || S.pd || !isLive() || document.hidden || S.intro)
          return;
        const fl = fleet();
        document.querySelectorAll("[data-up]").forEach((el) => {
          const u = fl.find((x) => x.id === el.dataset.up);
          if (u && u.st === "ok") el.textContent = T3(unitCalc(u).up);
        });
      }, 1000);

      /* ===== AUTHENTICATION & BOOTSTRAP ===== */
      const SESSION_KEY = "ptfi_active_session_v1";

      function updatePassIcon() {
        const inp = $("loginPass"),
          btn = $("togglePass");
        if (!inp || !btn) return;
        btn.innerHTML = I(inp.type === "password" ? "eye" : "eyeoff");
      }

      function enterDashboard(account, isRestore = false) {
        CURRENT_USER = account;
        try {
          localStorage.setItem(SESSION_KEY, account.user);
        } catch (e) {}

        S.page = account.pages[0];
        S.lens = PAGE_LENS[S.page];
        S.area = account.areas[0];
        S.level = 0;
        S.sel.clear();
        S.menu = null;
        S.modal = null;
        window.__fitted = 0;

        document.body.classList.remove("locked");
        const lv = $("loginView");
        if (isRestore) {
          lv.style.display = "none";
          lv.classList.add("hide");
        } else {
          lv.classList.add("hide");
          setTimeout(() => {
            if (CURRENT_USER) lv.style.display = "none";
          }, 560);
        }

        if (INTRO && !isRestore) {
          S.intro = true;
          S.t = 6;
          document.body.classList.add("intro");
        }
        reset("side", "mobdock", "left", "frame", "rp");
        renderAll();
        fit();
        window.__ready = 1;
        setTimeout(() => $("side").classList.remove("nt"), 150);
        if (INTRO && !isRestore) setTimeout(playIntro, 500);
        if (!isRestore)
          toast(`Selamat datang, ${account.name} (${account.role})`);
      }

      function logoutDashboard() {
        CURRENT_USER = null;
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (e) {}

        S.intro = false;
        S.modal = null;
        S.menu = null;
        window.__ready = 0;
        renderModal();
        document.body.classList.remove("intro");
        document.body.classList.add("locked");
        $("side").classList.add("nt");
        $("loginForm").reset();
        $("loginErr").classList.remove("show");
        updatePassIcon();

        const lv = $("loginView");
        lv.style.display = "grid";
        void lv.offsetWidth;
        lv.classList.remove("hide");
        setTimeout(() => $("loginUser")?.focus(), 100);
      }

      $("togglePass").addEventListener("click", () => {
        const inp = $("loginPass");
        inp.type = inp.type === "password" ? "text" : "password";
        updatePassIcon();
      });

      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const uVal = $("loginUser").value.trim().toLowerCase();
        const pVal = $("loginPass").value;
        const errEl = $("loginErr");
        const card = $("loginCard");

        const found = USERS.find(
          (acc) =>
            (acc.user.toLowerCase() === uVal ||
              acc.empId.toLowerCase() === uVal) &&
            acc.pass === pVal,
        );

        if (!found) {
          errEl.innerHTML = `${I("alert")}<span>Username atau kata sandi tidak valid.</span>`;
          errEl.classList.add("show");
          card.classList.remove("err-shake");
          void card.offsetWidth;
          card.classList.add("err-shake");
          return;
        }

        errEl.classList.remove("show");
        enterDashboard(found, false);
      });

      hgiProbe();
      updatePassIcon();

      /* Pulihkan sesi aktif jika pengguna sudah login sebelumnya */
      const savedUser = (() => {
        try {
          return localStorage.getItem(SESSION_KEY);
        } catch (e) {
          return null;
        }
      })();
      const restoredAccount = USERS.find((acc) => acc.user === savedUser);

      if (restoredAccount) {
        enterDashboard(restoredAccount, true);
      } else {
        setTimeout(() => $("loginUser")?.focus(), 120);
      }
    </script>
  </body>
</html>
