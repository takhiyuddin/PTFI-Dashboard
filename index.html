<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>PT Freeport Indonesia — Mine Operations Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://use.hugeicons.com/font/icons.css"
      onload="window.hgiProbe && hgiProbe()"
    />
    <style>
      :root {
        --bg: #f4f5f3;
        --card: #fff;
        --ink: #1d201e;
        --mut: #8d928f;
        --mut2: #b9bdba;
        --line: #e8eae7;
        --green: #43a047;
        --gp: #5f7a66;
        --blk: #dcdfdc;
        --or: #fbb03b;
        --bl: #3b82f6;
        --bl2: #5aa7f6;
        --red: #f4837d;
        --red2: #e5484d;
        --ease: cubic-bezier(0.65, 0, 0.25, 1);
        --spring: cubic-bezier(0.34, 1.45, 0.5, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        font-family:
          Inter, "SF Pro Display", "Segoe UI", system-ui, Roboto, Arial,
          sans-serif;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s,
          opacity 0.2s;
      }
      button:active {
        transform: scale(0.96);
      }
      button:focus-visible {
        outline: 2px solid var(--bl);
        outline-offset: 2px;
      }
      input {
        font: inherit;
      }
      svg.i {
        width: 20px;
        height: 20px;
        font-size: 20px;
        display: inline-block;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
        overflow: visible;
      }
      i.i {
        display: inline-block;
        width: 20px;
        height: 20px;
        font-size: 20px;
        line-height: 20px;
        text-align: center;
        flex: none;
        font-style: normal;
      }

      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes sl {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sc {
        from {
          top: -30%;
        }
        to {
          top: 100%;
        }
      }
      @keyframes grow {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes hintin {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(-50%);
        }
      }
      @keyframes sideIn {
        from {
          opacity: 0;
          transform: translateX(-28px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes itemIn {
        from {
          opacity: 0;
          transform: translateX(-14px) scale(0.85);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-6px);
        }
        40%,
        80% {
          transform: translateX(6px);
        }
      }

      /* ---------- LOGIN SCREEN ---------- */
      .login-view {
        position: fixed;
        inset: 0;
        z-index: 500;
        background-color: var(--bg);
        background-image: radial-gradient(#d3d7d3 1px, transparent 1.2px);
        background-size: 16px 16px;
        display: grid;
        place-items: center;
        padding: 20px;
        transition:
          opacity 0.55s var(--ease),
          transform 0.55s var(--ease);
      }
      .login-view.hide {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .login-card {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 32px;
        padding: 38px 34px 32px;
        box-shadow: 0 20px 60px rgba(29, 32, 30, 0.06);
        animation: pop 0.6s var(--spring) both;
      }
      .login-card.err-shake {
        animation: shake 0.38s var(--ease);
      }
      .login-logo {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 24px;
      }
      .login-logo svg {
        width: 100%;
        max-width: 270px;
        height: auto;
        display: block;
      }
      .login-head {
        text-align: center;
        margin-bottom: 26px;
      }
      .login-head h2 {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.3px;
        color: var(--ink);
      }
      .login-head p {
        font-size: 13.5px;
        color: var(--mut);
        margin-top: 6px;
      }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .fgroup {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .fgroup label {
        font-size: 12.5px;
        font-weight: 500;
        color: #555a57;
        padding-left: 2px;
      }
      .finput-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }
      .finput {
        width: 100%;
        height: 48px;
        border: 1px solid var(--line);
        background: #f7f8f6;
        border-radius: 15px;
        padding: 0 16px;
        font-size: 14.5px;
        color: var(--ink);
        outline: 0;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .finput:focus {
        border-color: var(--ink);
        background: #fff;
      }
      .finput-wrap .finput {
        padding-right: 46px;
      }
      .eye-btn {
        position: absolute;
        right: 8px;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--mut);
      }
      .eye-btn:hover {
        background: #eceeeb;
        color: var(--ink);
      }
      .login-err {
        font-size: 13px;
        color: var(--red2);
        background: #fdecea;
        border-radius: 12px;
        padding: 10px 14px;
        display: none;
        align-items: center;
        gap: 8px;
        animation: up 0.25s var(--ease);
      }
      .login-err.show {
        display: flex;
      }
      .login-submit {
        margin-top: 6px;
        height: 50px;
        width: 100%;
        border-radius: 16px;
        background: var(--ink);
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .login-submit:hover {
        background: #2f3431;
      }
      .login-foot {
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        text-align: center;
        font-size: 12px;
        color: var(--mut);
      }

      /* ---------- SHELL VISIBILITY ---------- */
      .shell {
        display: flex;
        min-height: 100dvh;
      }
      body.locked .shell {
        display: none;
      }

      body.dragging * {
        transition: none !important;
      }
      body.intro .bfill,
      body.intro .bfade,
      body.intro .bmk,
      body.intro .scr,
      body.intro .stream path,
      body.intro .ut i,
      body.intro .ut u,
      body.intro .crew .t i {
        transition: none !important;
      }

      /* ---------- sidebar ---------- */
      .side {
        position: sticky;
        top: 12px;
        align-self: flex-start;
        flex: none;
        height: calc(100dvh - 24px);
        margin: 12px 0 12px 12px;
        width: 76px;
        background: #fff;
        border-radius: 28px;
        display: flex;
        flex-direction: column;
        padding: 16px 12px 12px;
        z-index: 40;
        transition: width 0.5s var(--ease);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
        animation: sideIn 0.7s var(--ease) backwards;
      }
      .side.nt,
      .side.nt * {
        transition: none !important;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 6px 0 7px;
        margin-bottom: 12px;
        animation: itemIn 0.55s var(--spring) backwards 0.25s;
      }
      .logo svg {
        height: 30px;
        width: auto;
        flex: none;
      }
      .sch {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 46px;
        border-radius: 14px;
        border: 1px solid var(--line);
        padding: 0 15px;
        color: var(--mut);
        width: 100%;
        overflow: hidden;
        animation: itemIn 0.55s var(--spring) backwards 0.31s;
      }
      .sch:hover {
        background: #f7f8f6;
      }
      .sec {
        font-size: 9.5px;
        letter-spacing: 0.8px;
        color: var(--mut);
        font-weight: 500;
        margin: 18px 0 8px;
        text-align: center;
        white-space: nowrap;
        animation: fade 0.5s var(--ease) backwards 0.38s;
      }
      .sec ~ .sec {
        animation-delay: 0.7s;
      }
      .nv,
      .areas {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .it {
        display: flex;
        align-items: center;
        gap: 13px;
        height: 46px;
        width: 100%;
        padding: 0 16px;
        border-radius: 14px;
        color: #555a57;
        white-space: nowrap;
        position: relative;
        animation: itemIn 0.55s var(--spring) backwards;
      }
      .it:hover {
        background: #f4f5f3;
        color: var(--ink);
      }
      .it.on {
        background: #f1f3f0;
        color: var(--ink);
        font-weight: 500;
      }
      .it.on::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 3px;
        background: var(--ink);
      }
      .grp {
        position: relative;
        animation: itemIn 0.55s var(--spring) backwards 0.64s;
      }
      .nv > :nth-child(1) {
        animation-delay: 0.4s;
      }
      .nv > :nth-child(2) {
        animation-delay: 0.46s;
      }
      .nv > :nth-child(3) {
        animation-delay: 0.52s;
      }
      .nv > :nth-child(4) {
        animation-delay: 0.58s;
      }
      .areas .it:nth-child(1) {
        animation-delay: 0.74s;
      }
      .areas .it:nth-child(2) {
        animation-delay: 0.8s;
      }
      .areas .it:nth-child(3) {
        animation-delay: 0.86s;
      }
      .lb {
        opacity: 0;
        width: 0;
        overflow: hidden;
        pointer-events: none;
        white-space: nowrap;
      }
      .kids {
        display: block;
        position: absolute;
        left: 100%;
        top: -6px;
        padding-left: 14px;
        opacity: 0;
        visibility: hidden;
        transform: translateX(-8px);
        transition: 0.25s var(--ease);
        z-index: 60;
      }
      .ki {
        min-width: 230px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.16);
        padding: 6px;
        max-height: 72dvh;
        overflow: auto;
      }
      .grp:hover .kids,
      .grp:focus-within .kids {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .kid {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 13.5px;
        color: var(--mut);
        white-space: nowrap;
      }
      .kid:hover {
        background: #f6f7f5;
        color: var(--ink);
      }
      .kid.on {
        background: #f1f3f0;
        color: var(--ink);
        font-weight: 500;
      }
      .usr.nick {
        margin-top: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 44px;
        width: 100%;
        background: #f1f3f0;
        border-radius: 22px;
        animation: itemIn 0.55s var(--spring) backwards 0.94s;
      }
      .usr.nick:hover {
        background: #eef0ed;
      }
      .nk {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.2px;
      }

      /* ---------- main ---------- */
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 16px 20px 20px;
        gap: 14px;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 14px;
        position: relative;
      }
      .ttl {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
      }
      .ttl h1 {
        font-size: clamp(24px, 3vw, 36px);
        font-weight: 400;
        letter-spacing: -0.5px;
        white-space: nowrap;
        line-height: 1;
        padding-bottom: 0.06em;
      }
      .rf {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .rf:hover {
        background: #fff;
      }
      .rf:active .i {
        transform: rotate(180deg);
      }
      .rf .i,
      .rf svg.i {
        display: block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        transition: transform 0.5s var(--ease);
      }
      .rf .i::before {
        display: block;
        line-height: 20px;
      }
      .sels {
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        background: #f7f8f6;
        border-radius: 30px;
        height: 48px;
        padding: 0 6px;
        gap: 4px;
      }
      .sels .sep {
        width: 22px;
        height: 1px;
        background: var(--mut2);
      }
      .dd {
        position: relative;
        display: inline-flex;
      }
      .dd > button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        height: 38px;
        font-size: 15px;
        border-radius: 20px;
      }
      .dd > button:hover {
        background: #fff;
      }
      .dd > button:not(.rb):not(.cb) .i {
        width: 15px;
        height: 15px;
        font-size: 15px;
        color: var(--mut);
      }
      .dd > .rb,
      .dd > .cb {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        padding: 0;
        justify-content: center;
      }
      .pop {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        min-width: 200px;
        max-width: calc(100vw - 24px);
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        padding: 8px;
        z-index: 50;
        font-size: 14px;
        animation: pop 0.22s var(--spring);
        transform-origin: top left;
      }
      .pop.l {
        left: 0;
        right: auto;
        transform-origin: top left;
      }
      .pop.r {
        left: auto;
        right: 0;
        transform-origin: top right;
      }
      .pop button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        padding: 10px 12px;
        border-radius: 12px;
        white-space: nowrap;
      }
      .pop button:hover,
      .pop button.cur {
        background: #f1f3f0;
      }
      .pop h6 {
        font-size: 11px;
        color: var(--mut);
        padding: 6px 12px;
        font-weight: 500;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      .hacts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .acts {
        display: flex;
        gap: 4px;
        margin-right: 10px;
      }
      .acts button {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 42px;
        padding: 0 12px;
        border-radius: 21px;
        font-size: 15px;
      }
      .acts button:hover {
        background: #fff;
      }
      .acts .t {
        display: none;
      }
      .rb {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #fff;
        display: grid;
        place-items: center;
        position: relative;
      }
      .rb:hover {
        transform: translateY(-2px);
      }
      .rb .dot {
        position: absolute;
        top: 12px;
        right: 13px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red2);
        border: 2px solid #fff;
      }
      .pgsel,
      .pgsep {
        display: none;
      }
      .ava {
        font: 600 12px Inter;
        background: #e8eae7;
        color: var(--ink);
        display: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid #fff;
      }

      /* ---------- timeline ---------- */
      .tlrow {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
        gap: 22px;
        align-items: center;
      }
      .daypill {
        height: 52px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: #f7f8f6;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        position: relative;
      }
      .daypill .al {
        width: 40px;
        height: 30px;
        border-radius: 15px;
        background: var(--red);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .daypill .al.ok {
        background: #cfe3d1;
        color: var(--gp);
      }
      .daypill .al .i,
      .daypill .al svg.i {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        font-size: 17px;
        line-height: 17px;
      }
      .daypill .al .i::before {
        display: block;
        line-height: 17px;
      }
      .daypill .dd > button {
        padding: 0 4px;
      }
      .chip {
        font-size: 12px;
        background: #e6e8e5;
        color: var(--mut);
        padding: 7px 10px;
        border-radius: 12px;
        white-space: nowrap;
      }
      .today {
        font-size: 14px;
        color: var(--mut);
        padding: 6px 8px;
        border-radius: 10px;
      }
      .today:hover {
        background: #fff;
        color: var(--ink);
      }
      .track {
        position: relative;
        height: 64px;
        cursor: ew-resize;
        user-select: none;
        touch-action: none;
      }
      .tkin {
        position: absolute;
        inset: 0;
      }
      .tkline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        height: 1px;
        background: #c9cdc9;
      }
      .tick {
        position: absolute;
        bottom: 8px;
        width: 1px;
        height: 9px;
        background: #c9cdc9;
      }
      .tick.h {
        height: 14px;
      }
      .hl {
        position: absolute;
        bottom: 26px;
        font-size: 13px;
        color: var(--mut);
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .tag {
        position: absolute;
        bottom: 42px;
        font-size: 12px;
        background: #e3e6e3;
        color: var(--mut);
        padding: 4px 8px;
        border-radius: 7px;
        transform: translateX(-50%);
        font-weight: 500;
        z-index: 2;
        white-space: nowrap;
      }
      .alwin {
        position: absolute;
        bottom: 12px;
        top: 6px;
        background: repeating-linear-gradient(
          -45deg,
          #e6e8e5 0 3px,
          #f4f5f3 3px 7px
        );
        display: grid;
        place-items: center;
        color: var(--mut);
        cursor: pointer;
        transition: filter 0.2s;
      }
      .alwin:hover {
        filter: brightness(0.95);
      }
      .scr {
        position: absolute;
        bottom: 6px;
        top: 10px;
        width: 2px;
        background: var(--ink);
        transform: translateX(-1px);
        pointer-events: none;
        transition: left 0.6s var(--ease);
      }
      .scr::before {
        content: "";
        position: absolute;
        top: 0;
        left: -4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ink);
      }
      .scr b {
        position: absolute;
        top: -17px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        background: var(--ink);
        color: #fff;
        border-radius: 8px;
        padding: 2px 7px;
        font-weight: 500;
        z-index: 3;
        white-space: nowrap;
      }

      /* ---------- grid & left cards ---------- */
      .grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr) 410px;
        gap: 22px;
      }
      .col {
        min-height: 0;
        overflow: auto;
        scrollbar-width: none;
      }
      .col::-webkit-scrollbar,
      .rp::-webkit-scrollbar {
        display: none;
      }
      .lcards {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-bottom: 6px;
      }
      .cd {
        flex: none;
        background: transparent;
        border-radius: 28px;
        padding: 22px 24px;
        border: 1px solid var(--line);
        cursor: pointer;
        transition:
          border-color 0.25s,
          transform 0.35s var(--spring);
        animation: up 0.55s var(--ease) both;
        animation-delay: calc(var(--d, 0) * 70ms);
      }
      .cd:hover {
        border-color: #c9cdc9;
      }
      .cd.sel,
      .cd.sel:hover {
        border: 1.5px solid var(--ink);
      }
      .cd:has(.pop),
      .blk:has(.pop),
      .unit:has(.pop) {
        position: relative;
        z-index: 60;
      }
      .cd .top2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .bdg {
        white-space: nowrap;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 10px;
        border-radius: 7px;
        letter-spacing: 0.2px;
      }
      .bdg.gr {
        background: var(--green);
        color: #fff;
      }
      .bdg.s {
        background: #ecefec;
        color: var(--mut);
      }
      .bdg.o {
        background: var(--or);
        color: #3a2800;
      }
      .bdg.r {
        background: var(--red2);
        color: #fff;
      }
      .code {
        font-size: 12px;
        color: var(--mut);
        border: 1px solid #d5d8d5;
        border-radius: 7px;
        padding: 6px 10px;
      }
      .mg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 12px;
        margin-top: 18px;
      }
      .mg > div {
        min-width: 0;
      }
      .mg label {
        font-size: 14px;
        display: flex;
        gap: 3px;
      }
      .mg label sup {
        font-size: 9px;
        color: var(--mut);
      }
      .mg .v {
        font-size: clamp(22px, 2.1vw, 30px);
        letter-spacing: -0.8px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 2px;
      }
      .mg .v .i {
        width: 19px;
        height: 19px;
        font-size: 19px;
      }
      .bar {
        margin-top: 16px;
        font-size: 14px;
      }
      .btrack {
        height: 4px;
        border-radius: 3px;
        background: #e9ece9;
        margin-top: 8px;
        position: relative;
      }
      .bfill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: linear-gradient(90deg, #f27b6b, #f6c94c 55%, #7ccf79);
        transition: width 0.9s var(--ease);
      }
      .bfade {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        border-radius: 0 3px 3px 0;
        background: linear-gradient(90deg, #d6ecd6, #eef0ee);
        transition: left 0.9s var(--ease);
      }
      .bmk {
        position: absolute;
        top: 8px;
        transform: translateX(-50%);
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        white-space: nowrap;
        z-index: 2;
        background: var(--bg);
        padding: 0 3px;
        border-radius: 4px;
        transition: left 0.9s var(--ease);
      }
      .bmk::before {
        content: "";
        border: 4px solid transparent;
        border-bottom: 6px solid var(--ink);
        border-top: 0;
        margin-bottom: 2px;
      }
      .bend {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--mut);
        margin-top: 36px;
      }
      .cfoot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
      }
      .cfoot .dd {
        min-width: 0;
        overflow: visible;
      }
      .cfoot .dd > button {
        padding: 0;
        font-size: 15px;
        gap: 8px;
        height: 34px;
        white-space: nowrap;
        overflow: visible;
      }
      .cfoot .dd > button:hover {
        background: none;
      }
      .cfoot .dd > button .i,
      .cfoot .dd > button svg.i {
        flex: none;
        display: block;
        overflow: visible;
      }
      .cfoot .dd > button .i {
        height: 15px;
        line-height: 15px;
      }
      .cfoot .dd > button .i::before {
        display: block;
        line-height: 15px;
      }
      .cfoot .ic {
        display: flex;
        gap: 6px;
      }
      .cfoot .ic button {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        position: relative;
      }
      .cfoot .ic button:hover {
        background: #fff;
      }
      .cfoot .ic .i {
        width: 22px;
        height: 22px;
        font-size: 22px;
      }
      .cfoot .rd {
        position: absolute;
        top: 5px;
        right: 6px;
        width: 7px;
        height: 7px;
        background: var(--red2);
        border-radius: 50%;
      }

      /* ---------- map ---------- */
      .map {
        position: relative;
        border-radius: 24px;
        overflow: hidden;
        min-height: 0;
        background-color: var(--bg);
        background-image: radial-gradient(#d3d7d3 1px, transparent 1.2px);
        background-size: 16px 16px;
        touch-action: none;
        cursor: grab;
      }
      .map.full {
        position: fixed;
        inset: 0;
        z-index: 90;
        border-radius: 0;
        width: auto;
        height: auto !important;
      }
      .map.fsing {
        position: fixed;
        z-index: 90;
      }
      .map.grab {
        cursor: grabbing;
      }
      .tools,
      .zm {
        position: absolute;
        top: 8px;
        display: flex;
        gap: 10px;
        z-index: 5;
      }
      .tools {
        left: 8px;
      }
      .zm {
        right: 8px;
      }
      .map.full .tools,
      .map.full .zm {
        top: 16px;
      }
      .map.full .tools {
        left: 50%;
        transform: translateX(calc(-100% - 8px));
      }
      .map.full .zm {
        left: 50%;
        right: auto;
        transform: translateX(8px);
      }
      .tools button,
      .zm button {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #fff;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        animation: grow 0.55s var(--spring) backwards;
      }
      .tools button:nth-child(1) {
        animation-delay: 0.25s;
      }
      .tools button:nth-child(2) {
        animation-delay: 0.31s;
      }
      .tools button:nth-child(3) {
        animation-delay: 0.37s;
      }
      .zm button:nth-child(1) {
        animation-delay: 0.43s;
      }
      .zm button:nth-child(2) {
        animation-delay: 0.49s;
      }
      .zm button:nth-child(3) {
        animation-delay: 0.55s;
      }
      .tools button .i,
      .zm button .i {
        display: block;
        width: 22px;
        height: 22px;
        font-size: 22px;
        line-height: 22px;
      }
      .tools button .i::before,
      .zm button .i::before {
        display: block;
        line-height: 22px;
      }
      .tools button.on {
        background: var(--bl);
        color: #fff;
        border-color: var(--bl);
      }
      .map.fsing .tools button,
      .map.fsing .zm button,
      .map.fsing .hint {
        animation: none !important;
        opacity: 0;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        display: flex;
        flex-direction: column;
        transition: transform 0.35s var(--ease);
        animation: fade 0.5s var(--ease) backwards 0.1s;
      }
      .mh {
        flex: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
        gap: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--gp);
        color: #fff;
        border-radius: 22px;
        height: 40px;
        padding: 0 18px;
        font-size: 15px;
        white-space: nowrap;
        animation: pop 0.4s var(--spring) both;
      }
      .pill .i {
        width: 19px;
        height: 19px;
        font-size: 19px;
      }
      .pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .frame {
        flex: 1;
        min-height: 0;
        border: 2px solid #7d9283;
        border-radius: 26px;
        padding: 18px;
        display: grid;
        grid-template-columns:
          minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.9fr)
          minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) 28px minmax(0, 1.5fr);
        gap: 16px;
        background: rgba(255, 255, 255, 0.25);
      }
      .blk {
        border-radius: 20px;
        background: var(--blk);
        position: relative;
        padding: 14px 16px;
        color: #fff;
        font-size: 15px;
        transition:
          opacity 0.3s,
          background 0.3s;
        animation: pop 0.5s var(--spring) both;
        animation-delay: calc(var(--d, 0) * 45ms);
      }
      .blk.act {
        background: #fff;
        color: var(--ink);
        cursor: pointer;
      }
      .blk.idle {
        background: #e9ebe8;
        color: var(--mut);
      }
      .blk.idle .bt > span:first-child {
        color: var(--ink);
        font-weight: 500;
      }
      .blk.idle .m {
        color: #5d625f;
      }
      .blk.sel {
        outline: 2.5px solid var(--gp);
        outline-offset: 1px;
      }
      .blk.dim {
        opacity: 0.5;
      }
      .blk .bt {
        height: 24px;
        margin-top: -2px;
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .blk .bt > span:first-child {
        flex: none;
      }
      .blk .fl {
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-flex;
        align-items: center;
        font-size: 9px;
        font-weight: 600;
        height: 18px;
        line-height: 18px;
        padding: 0 5px;
        border-radius: 6px;
        background: var(--or);
        color: #3a2800;
      }
      .blk .fl.rs {
        background: var(--red2);
        color: #fff;
      }
      .blk .fl.gy {
        background: #d3d7d3;
        color: #555a57;
      }
      .blk .bt .dd {
        position: static;
        flex: none;
        margin-left: auto;
        display: flex;
        align-items: center;
        height: 24px;
      }
      .blk .bt .dd > button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 24px;
        padding: 0;
        color: var(--mut);
      }
      .blk .bt .dd > button .i {
        display: none;
      }
      .blk .bt .dd > button::before {
        content: "";
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
        box-shadow:
          -6px 0 0 currentColor,
          6px 0 0 currentColor;
      }
      .blk .pop {
        max-width: min(260px, 80vw);
        top: 44px;
      }
      .blk .pop.l {
        left: 8px;
        right: auto;
      }
      .blk .pop.r {
        right: 8px;
        left: auto;
      }
      .blk .m {
        position: absolute;
        left: 16px;
        right: 8px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
      }
      .blk .m div {
        display: flex;
        gap: 7px;
        align-items: center;
        white-space: nowrap;
        min-width: 0;
      }
      .blk .m div.p {
        gap: 10px;
      }
      .blk .m .i {
        width: 16px;
        height: 16px;
        font-size: 16px;
      }
      .blk .m span {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .blk.wet.act {
        background: #fff6e5;
      }
      .blk.restr.act {
        background: #fdecea;
      }
      .blk.wet.act::after,
      .blk.restr.act::after {
        content: "";
        position: absolute;
        left: 0;
        top: 18px;
        bottom: 18px;
        width: 4px;
        border-radius: 3px;
        background: var(--or);
      }
      .blk.restr.act::after {
        background: var(--red2);
      }
      .stdot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-left: 6px;
      }
      .band {
        grid-column: 1/4;
        border-radius: 14px;
        background: repeating-linear-gradient(
          -45deg,
          #c8ccc8 0 5px,
          #e2e5e2 5px 10px
        );
        height: 20px;
        align-self: center;
      }
      .infra {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 26px;
      }
      .infra .ir {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #5d625f;
      }
      .infra .ir span {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .infra small {
        font-size: 11px;
        color: var(--mut);
      }
      .infra b {
        font-weight: 500;
        font-size: 14px;
        color: var(--ink);
        white-space: nowrap;
      }
      .hint {
        position: absolute;
        left: 50%;
        bottom: 10px;
        width: max-content;
        max-width: calc(100% - 20px);
        text-align: center;
        transform: translateX(-50%);
        font-size: 11px;
        color: var(--mut);
        background: #fff;
        border-radius: 12px;
        padding: 6px 10px;
        z-index: 4;
        transition: opacity 0.2s;
        animation: hintin 0.6s var(--ease) backwards 0.9s;
      }

      /* ---------- right panel ---------- */
      .rp {
        background: transparent;
        border-radius: 28px;
        padding: 26px 26px 10px;
        min-height: 0;
        overflow: auto;
        scrollbar-width: none;
        animation: up 0.6s var(--ease) both 0.15s;
      }
      .rh {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .big {
        font-size: 36px;
        letter-spacing: -1px;
      }
      .big sup {
        font-size: 13px;
        color: var(--mut);
        margin-left: 3px;
      }
      .rh p {
        font-size: 14px;
        margin-top: 6px;
      }
      .cb {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        background: transparent;
      }
      .cb:hover {
        background: #fff;
      }
      .tabs {
        display: flex;
        margin-top: 22px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        flex: 1;
        padding: 12px 0;
        color: var(--mut);
        font-size: 16px;
        position: relative;
      }
      .tabs button.on {
        color: var(--ink);
      }
      .tabs button::after {
        content: "";
        position: absolute;
        left: 25%;
        right: 25%;
        bottom: -1px;
        height: 2px;
        background: var(--ink);
        transform: scaleX(0);
        transition: transform 0.35s var(--ease);
      }
      .tabs button.on::after {
        transform: scaleX(1);
        left: 0;
        right: 0;
      }
      .dv {
        display: flex;
        justify-content: space-between;
        margin-top: 22px;
        font-size: 15px;
      }
      .chips {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .ch {
        font-size: 14px;
        padding: 7px 14px;
        border-radius: 16px;
        background: var(--or);
      }
      .ch.b {
        background: var(--bl2);
        color: #fff;
      }
      .ch.n {
        background: #eceeeb;
        color: var(--mut);
      }
      .stream {
        margin-top: 14px;
        width: 100%;
        display: block;
      }
      .stream path {
        transition:
          d 0.8s var(--ease),
          fill 0.3s;
      }
      .stream rect[fill^="rgba"] {
        fill: rgba(244, 245, 243, 0.6);
      }
      .nums {
        display: flex;
        justify-content: space-between;
        font-size: 15px;
        color: var(--mut);
        margin-top: 2px;
      }
      .nums b {
        color: var(--ink);
        font-weight: 400;
      }
      .rng {
        position: relative;
        height: 28px;
        margin-top: 8px;
        touch-action: none;
      }
      .rng .tk {
        position: absolute;
        left: 0;
        right: 0;
        top: 12px;
        height: 5px;
        background: repeating-linear-gradient(
          90deg,
          #d0d4d0 0 2px,
          transparent 2px 5px
        );
      }
      .rng .ac {
        position: absolute;
        top: 11px;
        height: 7px;
        background: #c9cdc9;
        border-radius: 4px;
      }
      .rng .th {
        position: absolute;
        top: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #868b88;
        border: 3px solid #fff;
        box-shadow: 0 0 0 1px #c9cdc9;
        transform: translateX(-50%);
        cursor: ew-resize;
        touch-action: none;
      }
      .rng .th:hover {
        background: var(--ink);
      }
      .bts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .bts button {
        border: 1px solid #cfd3cf;
        border-radius: 6px;
        padding: 9px 6px;
        font-size: 12px;
        color: var(--mut);
        letter-spacing: 0.3px;
      }
      .bts button:hover {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .acc {
        border-top: 1px solid var(--line);
        margin-top: 24px;
      }
      .acc + .acc {
        margin-top: 0;
      }
      .acc .ah {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 0;
        width: 100%;
        font-size: 15px;
      }
      .acc .ah .rt {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sm {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .al2 {
        background: var(--red);
        color: #fff;
        border-radius: 16px;
        padding: 4px 12px;
        display: inline-flex;
        align-items: center;
      }
      .al2 .i {
        width: 17px;
        height: 17px;
        font-size: 17px;
      }
      .face {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #9aa09c;
        display: inline-block;
      }
      .crew {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        padding: 8px 0;
        animation: up 0.4s both;
      }
      .crew .t {
        height: 5px;
        border-radius: 3px;
        background: #edf0ed;
        position: relative;
      }
      .crew .t i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--green);
        border-radius: 3px;
        transition: width 0.8s var(--ease);
      }
      .fchips {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .fchips button {
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 12px;
        background: #f0f2ef;
        color: var(--mut);
      }
      .fchips button.on {
        background: var(--ink);
        color: #fff;
      }
      .unit {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px 16px 12px;
        margin-bottom: 12px;
        animation: up 0.45s var(--ease) both;
        transition:
          border-color 0.3s,
          background 0.3s;
      }
      .unit.warn {
        border-color: #f3b8b4;
        background: rgba(244, 131, 125, 0.08);
      }
      .ur {
        display: grid;
        grid-template-columns: 1.25fr 1fr 1fr 28px;
        gap: 8px;
        align-items: start;
      }
      .ur > div {
        min-width: 0;
      }
      .ur b {
        font-weight: 400;
        font-size: 15px;
        display: block;
      }
      .ur small {
        display: block;
        color: var(--mut);
        font-size: 13px;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .ld {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
        font-size: 15px;
      }
      .ld span:last-child {
        color: var(--mut);
      }
      .ut {
        height: 5px;
        background: #eceeec;
        border-radius: 3px;
        margin-top: 10px;
        position: relative;
      }
      .ut i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--ink);
        border-radius: 3px;
        transition: width 1.8s linear;
      }
      .ut u {
        position: absolute;
        top: 8px;
        transform: translateX(-50%);
        font-size: 13px;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        background: var(--bg);
        padding: 0 3px;
        border-radius: 4px;
        transition: left 1.8s linear;
      }
      .ut u::before {
        content: "";
        border: 4px solid transparent;
        border-bottom: 6px solid var(--ink);
        border-top: 0;
      }
      .ue {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 2px 8px;
        font-size: 11px;
        color: var(--mut);
        margin-top: 36px;
      }
      .ue span:last-child {
        text-align: right;
      }
      .ua {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
      }
      .ua button {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--mut);
      }
      .ua button:hover {
        background: #f0f2ef;
        color: var(--ink);
      }
      .ua button.on {
        background: #e8f1fd;
        color: var(--bl);
      }
      .ua .i {
        width: 19px;
        height: 19px;
        font-size: 19px;
      }

      /* ---------- modal / report / toast ---------- */
      .mbg {
        position: fixed;
        inset: 0;
        background: rgba(20, 24, 22, 0.45);
        z-index: 200;
        display: grid;
        place-items: center;
        padding: 20px;
        animation: fade 0.25s;
        backdrop-filter: blur(3px);
      }
      .modal {
        background: #fff;
        border-radius: 28px;
        width: min(760px, 100%);
        max-height: 88dvh;
        overflow: auto;
        padding: 28px 30px;
        animation: pop 0.35s var(--spring);
      }
      .modal:has(.rpt) {
        width: min(900px, 100%);
      }
      .modal h3 {
        font-size: 21px;
        font-weight: 500;
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .modal table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .modal th,
      .modal td {
        text-align: left;
        padding: 9px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .modal p,
      .modal li {
        font-size: 14px;
        line-height: 1.55;
        color: #434846;
      }
      .modal ul {
        padding-left: 18px;
        display: grid;
        gap: 8px;
      }
      .btn {
        background: var(--ink);
        color: #fff;
        border-radius: 14px;
        padding: 10px 16px;
        font-size: 14px;
      }
      .btn.l {
        background: #eef0ed;
        color: var(--ink);
      }
      .btn.danger {
        background: #fdecea;
        color: var(--red2);
        font-weight: 500;
      }
      .btn.danger:hover {
        background: var(--red2);
        color: #fff;
      }
      .sinput {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 16px;
        outline: 0;
        margin-bottom: 12px;
      }
      .sinput:focus {
        border-color: var(--ink);
      }
      .cams {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
      }
      .cam {
        aspect-ratio: 16/10;
        border-radius: 14px;
        background: linear-gradient(135deg, #1a1f1c, #2c3530);
        position: relative;
        overflow: hidden;
        color: #cfe;
        font-size: 11px;
        padding: 8px;
      }
      .cam::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 30%;
        background: linear-gradient(
          transparent,
          rgba(120, 255, 180, 0.12),
          transparent
        );
        animation: sc 3s linear infinite;
      }
      .cam b {
        position: absolute;
        right: 8px;
        top: 8px;
        color: #ff6b6b;
      }
      .rpt .meta {
        font-size: 15px;
        color: var(--mut);
      }
      .rpt .meta b {
        color: var(--ink);
        font-weight: 500;
      }
      .rpt .sh {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 26px 0 12px;
      }
      .rpt .sh.first {
        margin-top: 4px;
      }
      .rpt .sh h4 {
        font-size: 17px;
        font-weight: 500;
      }
      .rpt .hint2 {
        font-size: 13px;
        color: var(--mut);
        background: #f4f5f3;
        padding: 5px 12px;
        border-radius: 12px;
      }
      .rpt .acts2 {
        display: flex;
        gap: 8px;
      }
      .rpt .bo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 14px;
        font-size: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .rpt .bo:hover {
        background: #f4f5f3;
      }
      .rpt .bo .i {
        width: 18px;
        height: 18px;
        font-size: 18px;
      }
      .rpt .tw {
        overflow-x: auto;
      }
      .rpt table {
        min-width: 520px;
        border-collapse: separate;
        border-spacing: 0;
      }
      .rpt thead th {
        background: #f4f5f3;
        color: #555a57;
        font-size: 13px;
        font-weight: 500;
        padding: 12px 14px;
        border: 0;
      }
      .rpt thead th:first-child {
        border-radius: 12px 0 0 12px;
      }
      .rpt thead th:last-child {
        border-radius: 0 12px 12px 0;
      }
      .rpt tbody td {
        padding: 16px 14px;
        font-size: 14.5px;
        color: var(--ink);
        border-bottom: 1px solid var(--line);
      }
      .rpt tbody td b {
        font-weight: 500;
      }
      .rpt tbody tr:last-child td {
        border-bottom: 0;
      }
      .rpt tbody tr:hover td {
        background: #fafbf9;
      }
      .rpt .pl {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 10px;
        font-size: 13px;
        background: #e6ece7;
        color: var(--gp);
      }
      .rpt .pl.wet,
      .rpt .pl.mock {
        background: #fff1d6;
        color: #8a5a00;
      }
      .rpt .pl.restr {
        background: #fdecea;
        color: #c0353a;
      }
      .sys .tw {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 6px 8px 2px;
      }
      .sys table {
        min-width: 480px;
      }
      .sys th,
      .sys td {
        white-space: normal;
        vertical-align: top;
      }
      .sys tbody td:first-child {
        font-weight: 500;
      }
      .sys tbody td:last-child {
        color: #555a57;
      }
      .anl,
      .refl {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .an {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        font-size: 14.5px;
        background: #f4f5f3;
      }
      .an .ai {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        flex: none;
        background: #fff;
      }
      .an.warn {
        background: #fff6e5;
      }
      .an.warn .ai {
        color: #b97a00;
      }
      .an.crit {
        background: #fdecea;
      }
      .an.crit .ai {
        color: var(--red2);
      }
      .an.ok {
        background: #eaf3ec;
      }
      .an.ok .ai {
        color: var(--green);
      }
      .rf2 {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
        line-height: 1.55;
        color: #434846;
      }
      .rf2:last-child {
        border-bottom: 0;
      }
      .rf2 .ai {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        background: #f1f3f0;
        display: grid;
        place-items: center;
        flex: none;
        color: var(--mut);
      }
      .rf2 .ai .i {
        width: 16px;
        height: 16px;
        font-size: 16px;
      }
      .rf2 a {
        color: var(--bl);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .rf2 a:hover {
        text-decoration: underline;
      }
      .note {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-top: 22px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f4f5f3;
        color: var(--mut);
      }
      .note .i {
        margin-top: 2px;
      }
      .note p {
        font-size: 13px;
        line-height: 1.6;
        color: #555a57;
      }
      .note b {
        color: var(--ink);
        font-weight: 500;
      }
      .usr-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        padding: 16px 18px;
        border-radius: 18px;
        background: #f7f8f6;
        border: 1px solid var(--line);
        margin-bottom: 18px;
      }
      .usr-info {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .usr-badge {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        border-radius: 22px;
        font-size: 14px;
        z-index: 600;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        animation: sl 0.35s var(--spring);
        max-width: calc(100vw - 32px);
        text-align: center;
      }
      .sev {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .nlist button {
        align-items: flex-start;
        white-space: normal;
      }

      /* ---------- responsive ---------- */
      @media (min-width: 800px) {
        .top {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
          align-items: center;
          gap: 10px 14px;
        }
        .ttl {
          justify-self: start;
        }
        .sels {
          justify-self: center;
        }
        .hacts {
          justify-self: end;
          margin-left: 0;
        }
      }
      @media (min-width: 1100px) {
        .main {
          height: 100dvh;
          overflow: hidden;
        }
      }
      @media (min-width: 1300px) {
        .acts .t {
          display: inline;
        }
      }
      @media (max-width: 1399px) and (min-width: 1100px) {
        .grid {
          grid-template-columns: 290px minmax(0, 1fr) 370px;
          gap: 16px;
        }
        .tlrow {
          grid-template-columns: 290px minmax(0, 1fr);
          gap: 16px;
        }
      }
      @media (max-width: 1099px) {
        .grid {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .tlrow {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .lcards {
          flex-direction: row;
          overflow-x: auto;
          scroll-snap-type: x mandatory;
          scrollbar-width: none;
          padding-bottom: 4px;
        }
        .lcards .cd {
          min-width: min(320px, 82vw);
          scroll-snap-align: start;
        }
        .map {
          height: clamp(380px, 60vw, 540px);
          touch-action: pan-y;
          flex: none;
        }
        .rp {
          overflow: visible;
        }
      }
      @media (max-width: 799px) {
        .side {
          display: none;
        }
        .ava {
          display: grid;
          place-items: center;
        }
        .pgsel,
        .pgsep {
          display: inline-flex;
        }
        .main {
          padding: calc(12px + env(safe-area-inset-top)) 14px
            calc(24px + env(safe-area-inset-bottom));
        }
        .sels {
          width: 100%;
          order: 3;
          justify-content: space-between;
          overflow-x: auto;
        }
        .acts {
          margin-right: 0;
        }
        .rb,
        .ava,
        .dd > .rb {
          width: 44px;
          height: 44px;
        }
        .map {
          height: 460px;
        }
        .rp {
          padding: 22px 18px 6px;
          border-radius: 24px;
        }
        .cd {
          padding: 20px;
        }
        .big {
          font-size: 30px;
        }
        .mg .v {
          font-size: 28px;
        }
        .mbg {
          align-items: end;
          padding: 0;
        }
        .modal {
          width: 100%;
          padding: 22px 20px;
          border-radius: 28px 28px 0 0;
          max-height: 82dvh;
          animation: sl 0.45s var(--spring);
        }
        .hint {
          display: none;
        }
      }
      @media (max-width: 420px) {
        .acts button:nth-child(n + 2) {
          display: none;
        }
        .ttl h1 {
          font-size: 23px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media print {
        .side,
        .hacts,
        .tools,
        .zm,
        .login-view {
          display: none !important;
        }
        .main {
          height: auto;
          overflow: visible;
        }
      }
    </style>

      function act(a, d, e) {
        switch (a) {
          case "page":
            if (!canPage(d.v)) {
              toast("Akses halaman ini tidak tersedia untuk akun Anda");
              return;
            }
            S.page = d.v;
            S.lens = PAGE_LENS[d.v];
            S.level = 0;
            S.menu = null;
            reset("left", "rp");
            break;
          case "lens":
            S.modal = null;
            if (d.v === "cctv") {
              openModal("cctv", "Remote Operations & CCTV", camHTML());
              break;
            }
            S.lens = d.v;
            S.menu = null;
            reset("frame");
            break;
          case "menu":
            S.menu = S.menu === d.v ? null : d.v;
            break;
          case "area":
            if (!canArea(d.v)) {
              toast("Akses area ini tidak tersedia untuk akun Anda");
              return;
            }
            S.area = d.v;
            S.sel.clear();
            S.menu = null;
            S.modal = null;
            reset("left", "frame", "rp");
            break;
          case "level":
            S.level = +d.v;
            S.menu = null;
            break;
          case "day":
            S.day = +d.v;
            S.live = S.day === TODAY;
            if (S.live) S.t = NOWH;
            S.menu = null;
            break;
          case "today":
            S.day = TODAY;
            S.live = true;
            S.t = NOWH;
            break;
          case "tab":
            S.tab = d.v;
            break;
          case "mode":
            S.mode = d.v;
            break;
          case "overlay":
            S.overlay = !S.overlay;
            break;
          case "blk":
            if (S.pd) return;
            S.menu = null;
            if (S.mode === "multi" || e.shiftKey)
              S.sel.has(d.id) ? S.sel.delete(d.id) : S.sel.add(d.id);
            else if (S.sel.size === 1 && S.sel.has(d.id)) S.sel.clear();
            else {
              S.sel.clear();
              S.sel.add(d.id);
            }
            break;
          case "focus":
            S.sel.clear();
            S.sel.add(d.id);
            S.menu = null;
            S.modal = null;
            break;
          case "clear":
            S.sel.clear();
            break;
          case "fsel":
            S.sel.clear();
            if (d.v !== "all")
              blocks()
                .filter(
                  (b) => b.act && (d.v === "ok" ? !b.flag : b.flag === d.v),
                )
                .forEach((b) => S.sel.add(b.id));
            S.menu = null;
            break;
          case "setflag":
            setFlag(d.id, d.v);
            S.menu = null;
            break;
          case "acc":
            S.acc[d.v] = !S.acc[d.v];
            break;
          case "ftype":
            S.ftype = d.v;
            break;
          case "unitst":
            S.unitSt[d.id] = d.v;
            S.notes.unshift({
              t: hh(S.t),
              sev: d.v === "ok" ? "ok" : "warn",
              txt: `${d.id} → ${d.v === "ok" ? "operasional" : d.v === "down" ? "breakdown" : "maintenance"}`,
              read: false,
            });
            S.menu = null;
            break;
          case "uact": {
            const u = fleet().find((x) => x.id === d.id);
            if (!u) break;
            if (d.v === "flag") {
              S.unitSt[d.id] = "down";
              toast(d.id + " ditandai kendala (breakdown)");
            } else if (d.v === "loc") {
              S.modal = null;
              S.sel.clear();
              S.sel.add(u.blk);
              toast(d.id + " berada di blok " + u.blk);
            } else if (d.v === "route")
              toast("Permintaan ubah rute dikirim ke dispatch (simulasi)");
            else if (d.v === "assign") {
              const ids = ACTIVE.map((b) => b.id),
                n = ids[(ids.indexOf(u.blk) + 1) % ids.length];
              S.assign[d.id] = n;
              toast(`${d.id} dialihkan ke blok ${n}`);
            } else if (d.v === "sync")
              toast("Sinkronisasi telemetri " + d.id + " selesai");
            else if (d.v === "lock") {
              S.locked[d.id] = !S.locked[d.id];
              toast(S.locked[d.id] ? "Target dikunci" : "Target dilepas");
            } else if (d.v === "reset") {
              delete S.unitSt[d.id];
              toast("Siklus " + d.id + " di-reset");
            }
            break;
          }
          case "mute": {
            const k = S.area + d.v;
            S.mute[k] = !S.mute[k];
            toast(S.mute[k] ? "Alarm area dibisukan" : "Alarm area aktif");
            break;
          }
          case "log": {
            const i = +d.v;
            openModal(
              "log",
              "Log aktivitas — " + (S.page === "ecology" ? ECO[i] : LEVELS[i]),
              `<ul>${[`${hh(S.t)} Sinkronisasi data (simulasi)`, `${hh(Math.max(6, S.t - 0.4))} Pergantian operator kontrol`, `${hh(Math.max(6, S.t - 1.1))} Pemeriksaan ventilasi selesai`, `${hh(Math.max(6, S.t - 2.3))} Shift handover diterima`].map((x) => `<li>${x}</li>`).join("")}</ul>`,
            );

          case "refresh":
            S.t0 = Date.now();
            Object.keys(S.drift).forEach((k) => (S.drift[k] = [0, 0, 0, 0]));
            toast("Data disegarkan");
            break;
          case "share":
            try {
              navigator.clipboard.writeText(location.href);
            } catch (x) {}
            toast("Tautan disalin");
            break;
          case "report":
            openModal("report", "Laporan shift", reportHTML());
            break;
          case "csv": {
            const l = document.createElement("a");
            l.href = URL.createObjectURL(
              new Blob([csv()], { type: "text/csv" }),
            );
            l.download = `ptfi-${A().short}-${dLbl(S.day).replace(" ", "-")}.csv`;
            l.click();
            break;
          }
          case "print":
            window.print();
            break;
          case "search":
            openModal(
              "search",
              "Pencarian global",
              `<input class="sinput" id="sq" placeholder="Cari area, blok (mis. BB), atau unit (mis. LHD-GBC-03)…" autocomplete="off"><div id="sres">${searchRes("")}</div>`,
            );
            setTimeout(() => $("sq")?.focus(), 60);
            break;
          case "sys":
            S.menu = null;
            openModal("sys", "Profil Akses & Status Sistem", sysHTML());
            break;
          case "logout":
            logoutDashboard();
            return;
          case "alertwin":
            openModal(
              "al",
              "Peringatan pada jam " + hh(6 + winPos()[0] * 12),
              `<p>Pada rentang ini sistem mencatat <b>pelonggaran material basah (wet muck)</b> di drawpoint BB serta peningkatan aktivitas mikroseismik (simulasi). Respons yang disarankan: batasi akses, alihkan MineGem (remote) ke drawpoint terdekat, dan lakukan inspeksi geoteknik.</p><br><button class="btn" data-a="focus" data-id="BB">Fokuskan blok BB</button>`,
            );
            break;
          case "readall":
            S.notes.forEach((n) => (n.read = true));
            break;
          case "zoom":
            zoomBy(d.v > 0 ? 1.2 : 1 / 1.2);
            return;
          case "full":
            toggleFull();
            return;
          case "mclose":
            S.modal = null;
            break;
        }
        renderAll();
      }

      document.addEventListener("click", (e) => {
        if (!CURRENT_USER) return;
        const el = e.target.closest("[data-a]");
        if (
          el &&
          el.dataset.a === "mclose" &&
