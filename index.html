        )
          return;
        if (
          S.menu &&
          !e.target.closest(".pop") &&
          !(el && el.dataset.a === "menu")
        ) {
          S.menu = null;
          if (!el) {
            renderAll();
            return;
          }
        }
        if (el) act(el.dataset.a, el.dataset, e);
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "sq" && $("sres"))
          $("sres").innerHTML = searchRes(e.target.value);
      });
      document.addEventListener("keydown", (e) => {
        if (!CURRENT_USER) return;
        if (e.key === "Escape") {
          if (S.modal || S.menu) {
            S.modal = null;
            S.menu = null;
            renderAll();
          } else if ($("map").classList.contains("full")) toggleFull();
        }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          act("search", {}, e);
        }
      });

      /* ===== TIMELINE & RANGE DRAG ===== */
      (function () {
        const tr = $("track");
        let dn = false;
        const set = (e) => {
          const r = tr.getBoundingClientRect();
          S.t = 6 + clamp((e.clientX - r.left) / r.width, 0, 1) * 12;
          S.live = false;
          if (S.day === TODAY && Math.abs(S.t - NOWH) < 0.08) {
            S.t = NOWH;
            S.live = true;
          }
          renderAll();
        };
        tr.addEventListener("pointerdown", (e) => {
          if (e.target.closest(".alwin")) return;
          dn = true;
          S.pd = true;
          document.body.classList.add("dragging");
          tr.setPointerCapture(e.pointerId);
          set(e);
        });
        tr.addEventListener("pointermove", (e) => {
          if (dn) set(e);
        });
        const end = () => {
          dn = false;
          S.pd = false;
          document.body.classList.remove("dragging");
        };
        tr.addEventListener("pointerup", end);
        tr.addEventListener("pointercancel", end);
      })();
      document.addEventListener("pointerdown", (e) => {
        const th = e.target.closest(".th");
        if (!th) return;
        const idx = +th.dataset.th,
          box = $("rng").getBoundingClientRect();
        S.pd = true;
        document.body.classList.add("dragging");
        const mv = (ev) => {
          const x = clamp((ev.clientX - box.left) / box.width, 0, 1),
            r = S.range.slice();
          r[idx] =
            idx === 0 ? Math.min(x, r[1] - 0.08) : Math.max(x, r[0] + 0.08);
          S.range = r;
          renderRight();
        };
        const up = () => {
          S.pd = false;
          document.body.classList.remove("dragging");
          removeEventListener("pointermove", mv);
          removeEventListener("pointerup", up);
          removeEventListener("pointercancel", up);
        };
        addEventListener("pointermove", mv);
        addEventListener("pointerup", up);
        addEventListener("pointercancel", up);
        e.preventDefault();
      });

      /* ===== MAP PAN / ZOOM / FULLSCREEN ===== */
      const NW = 812,
        NH = 642;
      const applyView = () =>
        ($("world").style.transform =
          `translate(${S.view.x}px,${S.view.y}px) scale(${S.view.k})`);
      function applyV(v) {
        Object.assign(S.view, v);
        const w = $("world");
        w.style.width = v.W + "px";
        w.style.height = v.H + "px";
        applyView();
      }
      function viewFor(mw, mh, full) {
        if (!full) {
          const top = 64,
            bottom = wide() ? 44 : 0,
            availH = mh - top - bottom;
          const k = Math.max(0.3, Math.min(1.2, (mw - 20) / NW, availH / NH));
          return {
            k,
            W: NW,
            H: NH,
            x: (mw - NW * k) / 2,
            y: top + Math.max(0, (availH - NH * k) / 2),
          };
        }
        const aw = mw - 40,
          ah = mh - 76 - 48,
          k = Math.max(0.3, Math.min(2, aw / NW, ah / NH));
        return { k, W: aw / k, H: ah / k, x: 20, y: 76 };
      }
      function fit() {
        const m = $("map"),
          w = $("world");
        if (!m.clientWidth || S.anim) return;
        const v = viewFor(
          m.clientWidth,
          m.clientHeight,
          m.classList.contains("full"),
        );
        if (!window.__fitted) {
          w.style.transition = "none";
          applyV(v);
          void w.offsetWidth;
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              w.style.transition = "";
              window.__fitted = 1;
            }),
          );
        } else applyV(v);
      }
      function toggleFull() {
        const m = $("map"),
          w = $("world");
        if (S.anim) return;
        const opening = !m.classList.contains("full");
        const vw = document.documentElement.clientWidth,
          vh = document.documentElement.clientHeight;
        const v0 = { ...S.view };
        let b0, b1, v1, ph;
        if (opening) {
          const r = m.getBoundingClientRect();
          ph = document.createElement("div");
          ph.id = "mapph";
          if (!wide()) ph.style.cssText = `height:${r.height}px;flex:none`;
          m.before(ph);
          b0 = { x: r.left, y: r.top, w: r.width, h: r.height, r: 24 };
          b1 = { x: 0, y: 0, w: vw, h: vh, r: 0 };
          v1 = viewFor(vw, vh, true);
        } else {
          ph = $("mapph");
          const r = ph.getBoundingClientRect();
          b0 = { x: 0, y: 0, w: vw, h: vh, r: 0 };
          b1 = { x: r.left, y: r.top, w: r.width, h: r.height, r: 24 };
          v1 = viewFor(r.width, r.height, false);
        }
        const setBox = (b) => {
          m.style.left = b.x + "px";
          m.style.top = b.y + "px";
          m.style.width = b.w + "px";
          m.style.height = b.h + "px";
          m.style.borderRadius = b.r + "px";
        };
        S.anim = true;
        m.classList.add("fsing");
        m.classList.remove("full");
        setBox(b0);
        w.style.transition = "none";
        const D = 650,
          t0 = performance.now(),
          L = (a, b, t) => a + (b - a) * t,
          ease = (t) =>
            t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        const step = (now) => {
          const p = Math.min(1, Math.max(0, (now - t0) / D)),
            e = ease(p);
          setBox({
            x: L(b0.x, b1.x, e),
            y: L(b0.y, b1.y, e),
            w: L(b0.w, b1.w, e),
            h: L(b0.h, b1.h, e),
            r: L(b0.r, b1.r, e),
          });
          applyV({
            k: L(v0.k, v1.k, e),
            x: L(v0.x, v1.x, e),
            y: L(v0.y, v1.y, e),
            W: L(v0.W, v1.W, e),
            H: L(v0.H, v1.H, e),
          });
          if (p < 1) requestAnimationFrame(step);
          else {
            if (opening) m.classList.add("full");
            m.classList.remove("fsing");
            ["left", "top", "width", "height", "borderRadius"].forEach(
              (k) => (m.style[k] = ""),
            );
            if (!opening) ph.remove();
            S.anim = false;
            w.style.transition = "";
            fit();
          }
        };
        requestAnimationFrame(step);
      }
      function zoomBy(f, cx, cy) {
        const r = $("map").getBoundingClientRect();
        cx = cx ?? r.width / 2;
        cy = cy ?? r.height / 2;
        const nk = clamp(S.view.k * f, 0.3, 2.6),
          rf = nk / S.view.k;
        S.view.x = cx - (cx - S.view.x) * rf;
        S.view.y = cy - (cy - S.view.y) * rf;
        S.view.k = nk;
        applyView();
      }
      (function () {
        const m = $("map"),
          w = $("world");
        let st = null;
        m.addEventListener(
          "wheel",
          (e) => {
            if (!wide() && !e.ctrlKey && !m.classList.contains("full")) return;
            e.preventDefault();
            const r = m.getBoundingClientRect();
            w.style.transition = "none";
            zoomBy(
              e.deltaY < 0 ? 1.1 : 1 / 1.1,
              e.clientX - r.left,
              e.clientY - r.top,
            );
            requestAnimationFrame(() => (w.style.transition = ""));
          },
          { passive: false },
        );
        m.addEventListener("pointerdown", (e) => {
          if (!e.target.closest("button,.pop,.tools,.zm"))
            st = {
              x: e.clientX,
              y: e.clientY,
              vx: S.view.x,
              vy: S.view.y,
              mv: false,
            };
        });
        addEventListener("pointermove", (e) => {
          if (!st) return;
          const dx = e.clientX - st.x,
            dy = e.clientY - st.y;
          if (!st.mv && Math.hypot(dx, dy) > 5) {
            st.mv = true;
            S.pd = true;
            m.classList.add("grab");
            w.style.transition = "none";
          }
          if (st.mv) {
            S.view.x = st.vx + dx;
            S.view.y = st.vy + dy;
            applyView();
          }
        });
        const end = () => {
          if (st && st.mv) setTimeout(() => (S.pd = false), 60);
          m.classList.remove("grab");
          w.style.transition = "";
          st = null;
        };
        addEventListener("pointerup", end);
        addEventListener("pointercancel", end);
      })();
      new ResizeObserver(() => fit()).observe($("map"));

      /* ===== INTRO & LIVE SIMULATOR ===== */
      const INTRO = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      function endIntro() {
        if (!S.intro) return;
        S.intro = false;
        document.body.classList.remove("intro");
        RAWH = jakartaHour();
        NOWH = Math.min(18, Math.max(6, RAWH));
        if (S.live && S.day === TODAY) S.t = NOWH;
        renderAll();
      }
      function playIntro() {
        if (!S.intro) return;
        const t0 = performance.now(),
          D = 2800;
        const step = (now) => {
          if (!S.intro) return;
          RAWH = jakartaHour();
          NOWH = Math.min(18, Math.max(6, RAWH));
          const p = Math.min(1, Math.max(0, (now - t0) / D));
          S.t = 6 + (NOWH - 6) * (1 - Math.pow(1 - p, 3));
          renderTL();
          renderLeft();
          renderMap();
          renderRight();
          if (p < 1) requestAnimationFrame(step);
          else endIntro();
        };
        requestAnimationFrame(step);
      }
      document.addEventListener(
        "pointerdown",
        () => {
          if (S.intro) endIntro();
        },
        true,
      );

      setInterval(() => {
        if (!CURRENT_USER || S.pd || document.hidden || S.intro) return;
        S.tick++;
        RAWH = jakartaHour();
        NOWH = Math.min(18, Math.max(6, RAWH));
        const nd = jakartaDayNum();
        if (nd !== TODAY) {
          if (S.day === TODAY) S.day = nd;
          TODAY = nd;
        }
        if (!isLive() && S.day === TODAY && S.live) S.t = NOWH;
        if (isLive()) {
          S.t = NOWH;
          Object.keys(S.drift).forEach(
            (k) =>
              (S.drift[k] = S.drift[k].map(
                (v, i) => v + 0.00035 * (0.5 + Math.random()) * (1 - i * 0.08),
              )),
          );
          if (Math.random() < 0.05) {
            const fl = fleet(),
              u = fl[Math.floor(Math.random() * fl.length)];
            if (u.st === "ok" && !S.locked[u.id]) {
              S.unitSt[u.id] = "down";
              S.notes.unshift({
                t: hh(S.t),
                sev: "warn",
                txt: `${u.id} breakdown terdeteksi (simulasi) — blok ${u.blk}`,
                read: false,
              });
            } else if (u.st !== "ok") {
              S.unitSt[u.id] = "ok";
              S.notes.unshift({
                t: hh(S.t),
                sev: "ok",
                txt: `${u.id} kembali operasional`,
                read: false,
              });
            }
          }
          S.notes = S.notes.slice(0, 12);
        }
        renderTop();
        dayPill();
        renderTL();
        renderLeft();
        renderMap();
        renderRight();
      }, 2000);
      setInterval(() => {
        if (!CURRENT_USER || S.pd || !isLive() || document.hidden || S.intro)
          return;
        const fl = fleet();
        document.querySelectorAll("[data-up]").forEach((el) => {
          const u = fl.find((x) => x.id === el.dataset.up);
          if (u && u.st === "ok") el.textContent = T3(unitCalc(u).up);
        });
      }, 1000);

      /* ===== AUTHENTICATION & BOOTSTRAP ===== */
      function updatePassIcon() {
        const inp = $("loginPass"),
          btn = $("togglePass");
        if (!inp || !btn) return;
        btn.innerHTML = I(inp.type === "password" ? "eye" : "eyeoff");
      }

      function enterDashboard(account) {
        CURRENT_USER = account;
        S.page = account.pages[0];
        S.lens = PAGE_LENS[S.page];
        S.area = account.areas[0];
        S.level = 0;
        S.sel.clear();
        S.menu = null;
        S.modal = null;
        window.__fitted = 0;

        document.body.classList.remove("locked");
        const lv = $("loginView");
        lv.classList.add("hide");
        setTimeout(() => {
          if (CURRENT_USER) lv.style.display = "none";
        }, 560);

        if (INTRO) {
          S.intro = true;
          S.t = 6;
          document.body.classList.add("intro");
        }
        reset("side", "left", "frame", "rp");
        renderAll();
        fit();
        window.__ready = 1;
        setTimeout(() => $("side").classList.remove("nt"), 150);
        if (INTRO) setTimeout(playIntro, 700);
        toast(`Selamat datang, ${account.name} (${account.role})`);
      }

      function logoutDashboard() {
        CURRENT_USER = null;
        S.intro = false;
        S.modal = null;
        S.menu = null;
        window.__ready = 0;
        renderModal();
        document.body.classList.remove("intro");
        document.body.classList.add("locked");
        $("side").classList.add("nt");
        $("loginForm").reset();
        $("loginErr").classList.remove("show");
        updatePassIcon();

        const lv = $("loginView");
        lv.style.display = "grid";
        void lv.offsetWidth;
        lv.classList.remove("hide");
        setTimeout(() => $("loginUser")?.focus(), 100);
      }

      $("togglePass").addEventListener("click", () => {
        const inp = $("loginPass");
        inp.type = inp.type === "password" ? "text" : "password";
        updatePassIcon();
      });

      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const uVal = $("loginUser").value.trim().toLowerCase();
        const pVal = $("loginPass").value;
        const errEl = $("loginErr");
        const card = $("loginCard");

        const found = USERS.find(
          (acc) => acc.user.toLowerCase() === uVal && acc.pass === pVal,
        );

        if (!found) {
          errEl.innerHTML = `${I("alert")}<span>Username atau kata sandi tidak valid.</span>`;
          errEl.classList.add("show");
          card.classList.remove("err-shake");
          void card.offsetWidth;
          card.classList.add("err-shake");
          return;
        }

        errEl.classList.remove("show");
        enterDashboard(found);
      });

      hgiProbe();
      updatePassIcon();
      setTimeout(() => $("loginUser")?.focus(), 120);
    </script>
  </body>
</html>
